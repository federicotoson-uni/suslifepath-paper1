id: smallsat_700km_sso
description: >
  Reference mission for SSCI normalisation — notional 500 kg smallsat at
  700 km SSO. Same reference adopted by Paper 0 (Toson 2026, Zenodo
  preprint v2.0.0). All SSCI scores are expressed as multiples of the
  domain-specific raw scores of this mission.

orbit:
  altitude_km: 700
  inclination_deg: 98.0           # SSO at 700 km
  eccentricity: 0.001
  operational_lifetime_yr: 7
  residual_lifetime_yr: 25        # IADC-25yr compliant

mass_budget:
  dry_mass_kg: 500
  propellant_mass_kg: 0.0
  total_wet_mass_kg: 500

geometry:
  exposed_surface_m2: 5.0
  total_surface_m2: 15.0
  cross_section_m2: 3.0

cost:
  build_cost_usd: 1.0e8           # 100 MUSD typical mid-size mission
  programme_cost_usd: 3.0e8
  reference_cost_class: smallsat

# Same inventory as the OpenLCA product system smallsat_700km_sso_v1
# ("Reference smallsat 500kg manufacturing", assembled by hand on 12/06/2026);
# aligned on 13/10/2026, so that MC and the terrestrial domain use one reference.
materials:
  - { id: aluminium_6061,      mass_kg: 175, criticality_factor: 0.15 }  # primary structure 35%
  - { id: CFRP_composites,     mass_kg:  50, criticality_factor: 0.40 }  # panels and booms 10%
  - { id: titanium_structure,  mass_kg:  30, criticality_factor: 0.55 }  # fittings 6%
  - { id: steel_fasteners,     mass_kg:  20, criticality_factor: 0.12 }  # fasteners and tanks 4%
  - { id: misc_thermal,        mass_kg:  50, criticality_factor: 0.30 }  # MLI and miscellaneous 10%
  - { id: lithium_battery,     mass_kg:  40, criticality_factor: 0.85 }  # battery 8%
  - { id: silicon_solar_cells, mass_kg:  20, criticality_factor: 0.65 }  # solar cells 4%
  - { id: copper_wiring,       mass_kg:  25, criticality_factor: 0.20 }  # harness 5%
  - { id: PCB_FR4,             mass_kg:  60, criticality_factor: 0.30 }  # avionics boards 12%
  - { id: misc_electronics,    mass_kg:  30, criticality_factor: 0.55 }  # integrated electronics 6%

launch:
  vehicle: Falcon9_dedicated
  propellant_share_kg:
    kerosene: 4375                # 500/16000 * 140000 kg RP-1
    LOX: 10887                    # F9 load 488 t = 140 t RP-1 + 348 t LOX (2.49:1)

reentry:
  reentry_class: medium_uncontrolled
  expected_demise_fraction: 0.70  # partial demise for 500 kg class

openlca:
  product_system_id: smallsat_700km_sso_v1

output:
  reference_mission: self
